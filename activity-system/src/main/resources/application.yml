server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: campus-activity-system
  datasource:
    url: jdbc:mysql://localhost:3306/campus_activity?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  sql:
    init:
      mode: never  # 通过 schema.sql/data.sql 手工执行, 不让 Spring 自动跑

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted   # 全局逻辑删除字段
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: campus-activity-secret-key-must-be-long-enough-2026
  expire-hours: 24

# springdoc-openapi 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.campus.activity: debug
    org.springframework.web: info
